# --------------------------------------------------
# YEMEKHANE BACKEND UYGULAMA AYARLARI
#
# Bu dosya:
# - Uygulamanın adını belirler.
# - Backend'i 8082 portunda çalıştırır.
# - Proje kökündeki .env dosyasını yükler.
# - MySQL bağlantı bilgilerini .env dosyasından alır.
# - Flyway migration sistemini etkinleştirir.
# --------------------------------------------------

spring.application.name=yemekhane-backend

server.port=8082

# Proje kökündeki uzantısız .env dosyasını
# properties formatında içeri aktarır.
spring.config.import=optional:file:./.env[.properties][encoding=utf-8]

# --------------------------------------------------
# MYSQL DATASOURCE AYARLARI
# --------------------------------------------------

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --------------------------------------------------
# HIKARI CONNECTION POOL AYARLARI
#
# Spring Boot JDBC ile HikariCP'yi otomatik kullanır.
# Bu havuz veritabanı bağlantılarını tekrar kullanarak
# her sorguda yeni bağlantı açılmasını engeller.
# --------------------------------------------------

spring.datasource.hikari.pool-name=YemekhaneHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ------------------------------------------------------------------------------
# JPA VE HIBERNATE YAPILANDIRMASI
# ------------------------------------------------------------------------------

# Veritabanı şema doğrulama stratejisi:
# 'validate': Hibernate Java entity sınıfları ile veritabanı tablolarının uyumunu kontrol eder.
# Tabloları oluşturmaz, silmez veya güncellemez (bu işi Flyway üstlenir).
# Eşleşmeyen bir durum varsa uygulama hata verip kapanır. En güvenli yöntemdir.
spring.jpa.hibernate.ddl-auto=validate

# Open Session in View (OSIV) Kapatma:
# 'false': Veritabanı oturumunun (Session) sadece @Transactional servis katmanlarında
# açık kalmasını sağlar. Controller veya View katmanlarında veritabanı bağlantısını
# açık tutmayarak, bağlantı havuzunun (Connection Pool) gereksiz tüketilmesini engeller.
spring.jpa.open-in-view=false

# Zaman Dilimi Yapılandırması:
# Veritabanına kaydedilen tarih ve saat (örneğin Instant) verilerinin
# standart olarak UTC (Universal Coordinated Time) zaman diliminde yazılıp okunmasını sağlar.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# SQL Sorgularını Konsola Yazdırma:
# 'true': Hibernate/JPA'nın arka planda MySQL için ürettiği SQL sorgularını terminalde gösterir.
spring.jpa.show-sql=true

# SQL Sorgularını Formatlama:
# 'true': Konsola yazdırılan SQL sorgularının okunabilirliğini artırmak için
# onları tek satır yerine düzenli, girintili ve satırlara bölünmüş (pretty-print) şekilde basar.
spring.jpa.properties.hibernate.format_sql=true

# --------------------------------------------------
# FLYWAY MIGRATION AYARLARI
# --------------------------------------------------


# Flyway'i çalıştır.
spring.flyway.enabled=true

# SQL migration dosyalarını bu klasörde ara.
spring.flyway.locations=classpath:db/migration

# Eski migration dosyalarının değiştirilmediğini kontrol et.
spring.flyway.validate-on-migrate=true

# --------------------------------------------------
# BAŞLANGIÇ ADMIN KULLANICISI
#
# Gerçek değerler .env dosyasından alınır.
# enabled=false olduğunda başlangıç admin işlemi çalışmaz.
# --------------------------------------------------

app.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap-admin.fullName=${BOOTSTRAP_ADMIN_FULL_NAME:}
app.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}


# --------------------------------------------------
# JWT AYARLARI
#
# Secret değer .env dosyasından okunur.
# Access token varsayılan olarak 1 saat geçerlidir.
# --------------------------------------------------

app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=${JWT_ISSUER:yemekhane-backend}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}

# Virgülle ayrılmış frontend origin listesi. Production ortamında açıkça sınırlandırılmalıdır.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

springdoc.swagger-ui.path=/swagger-ui.html
