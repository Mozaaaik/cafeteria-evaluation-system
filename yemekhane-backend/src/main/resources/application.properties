# --------------------------------------------------
# YEMEKHANE BACKEND UYGULAMA AYARLARI
#
# Bu dosya:
# - Uygulamanın adını belirler.
# - Backend'i 8080 portunda çalıştırır.
# - Proje kökündeki .env dosyasını yükler.
# - MySQL bağlantı bilgilerini .env dosyasından alır.
# - Flyway migration sistemini etkinleştirir.
# --------------------------------------------------

spring.application.name=yemekhane-backend

server.port=8080

# Proje kökündeki uzantısız .env dosyasını
# properties formatında içeri aktarır.
spring.config.import=optional:file:./.env[.properties]

# --------------------------------------------------
# MYSQL DATASOURCE AYARLARI
# --------------------------------------------------

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --------------------------------------------------
# HIKARI CONNECTION POOL AYARLARI
#
# Spring Boot JDBC ile HikariCP'yi otomatik kullanır.
# Bu havuz veritabanı bağlantılarını tekrar kullanarak
# her sorguda yeni bağlantı açılmasını engeller.
# --------------------------------------------------

spring.datasource.hikari.pool-name=YemekhaneHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# --------------------------------------------------
# FLYWAY MIGRATION AYARLARI
# --------------------------------------------------


# Flyway'i çalıştır.
spring.flyway.enabled=true

# SQL migration dosyalarını bu klasörde ara.
spring.flyway.locations=classpath:db/migration

# Eski migration dosyalarının değiştirilmediğini kontrol et.
spring.flyway.validate-on-migrate=true